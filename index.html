<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Standub — Live Electronic Music</title>
<meta name="description" content="Standub — Belgian solo live electronic performer." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>section{scroll-margin-top:4.5rem}</style>
</head>
<body>
<nav aria-label="Primary" class="site-nav">
<a href="/">Home</a>
<a href="/about">About</a>
<a href="/workshops">Workshops</a>
</nav>

<main>
<section class="hero" id="home" aria-label="Hero">
<div class="hero-inner fade" style="position:relative;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem;width:100%;max-width:none">
<img src="assets/home-logo.svg" alt="STANDUB logo" style="width:320px;max-width:70vw;height:auto;z-index:2;position:relative" />
<div style="position:absolute;inset:0;z-index:0">
<img src="assets/home-foto.jpg" alt="Standub background" style="width:100%;height:100%;object-fit:cover;display:block" />
<div style="position:absolute;top:.75rem;right:.5rem;z-index:10;display:flex;gap:.75rem">
<a href="https://www.instagram.com/standubmusic?stkn=MWNnN3F4M3p2N3VjeA==" aria-label="Instagram" target="_blank" rel="noopener"><img src="assets/icons/instagram.svg" alt="Instagram" style="width:28px;height:28px;display:block;"></a>
<a href="https://youtube.com" aria-label="YouTube" target="_blank" rel="noopener"><img src="assets/icons/youtube.svg" alt="YouTube" style="width:28px;height:28px;display:block;"></a>
<a href="https://open.spotify.com/artist/4fRAapFroZDOJv3Lmr0Cox?si=-UoPb2yGQvaLkWT3nXV9yg" aria-label="Spotify" target="_blank" rel="noopener"><img src="assets/icons/spotify.svg" alt="Spotify" style="width:28px;height:28px;display:block;"></a>
<a href="https://music.apple.com/us/artist/standub/1879868421" aria-label="Apple Music" target="_blank" rel="noopener"><img src="assets/icons/apple.svg" alt="Apple Music" style="width:28px;height:28px;display:block;"></a>
<a href="https://soundcloud.com" aria-label="SoundCloud" target="_blank" rel="noopener"><img src="assets/icons/soundcloud.svg" alt="SoundCloud" style="width:28px;height:28px;display:block;"></a>
</div>
</div>
</div>
</section>

<section class="section" id="tour" aria-label="Shows" style="position:relative;min-height:100vh;padding:0;overflow:hidden;">
  <div style="position:absolute;inset:0;z-index:0;">
    <div id="video-player" style="position:absolute;inset:0;z-index:0;overflow:hidden;"><div id="video-loading" style="position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,#12101a,#0a0c14);transition:opacity 1.2s ease;opacity:1;pointer-events:none;"></div></div>
  </div>
  <div style="position:absolute;inset:0;z-index:1;background:linear-gradient(180deg, rgba(10,12,20,0.55) 0%, rgba(10,12,20,0.25) 60%, rgba(10,12,20,0.75) 100%);pointer-events:none;"></div>
  <div class="container" style="position:relative;z-index:2;padding-top:6rem;padding-bottom:6rem;">
    <h2 class="section-heading">Shows</h2>
    <div id="tour-list" style="margin-top:2rem;"></div>
  </div>
  <script>
(async () => {
  try {
    const res = await fetch("https://video.stanmeeus.workers.dev/video");
    const cfg = await res.json();
    const container = document.getElementById("video-player");
    if (cfg.enabled && cfg.url) {
      const id = cfg.url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]+)/)?.[1];
      if (id) {
        container.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&playsinline=1&rel=0&iv_load_policy=3&cc_load_policy=0&disablekb=1&fs=0&modestbranding=1&showinfo=0" style="position:absolute;top:50%;left:50%;width:100vw;height:56.25vw;min-width:100%;min-height:100%;transform:translate(-50%,-50%);border:0;pointer-events:none;" allow="autoplay; encrypted-media" title="Tour video"></iframe>`;
      } else {
        container.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(242,240,234,0.45);font-style:italic">Placeholder — looping background video (replace with authentic Standub footage)</div>`;
      }
    } else {
      container.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(242,240,234,0.45);font-style:italic">No video configured.</div>`;
    }
  } catch (e) {
    document.getElementById("video-player").innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(242,240,234,0.45);font-style:italic">Video unavailable.</div>`;
  }
  setTimeout(() => { const ld = document.getElementById("video-loading"); if (ld) ld.style.opacity = "0"; }, 1500);
})();
</script><script>
(async () => {
  try {
    const res = await fetch("https://standub-worker.stanmeeus.workers.dev/api/tour-dates");
    const data = await res.json();
    const list = document.getElementById("tour-list");
    if (!Array.isArray(data) || data.length === 0) {
      list.innerHTML = '<div style="padding:.75rem 0;color:var(--mist);font-family:\'Space Grotesk\',sans-serif;font-size:1rem">No dates announced yet.</div>';
    } else {
      list.innerHTML = data.map(d => {
        const dateStr = d.date ? d.date : '';
        const venueStr = d.venue || '';
        const locStr = [d.city || '', d.country || ''].filter(Boolean).join(', ');
        const soldStr = d.soldOut ? '<span style="color:var(--rust);font-family:\'Space Grotesk\',sans-serif;font-size:inherit"> Sold out</span>' : '';
        const ticketStr = d.url ? `<a href="${d.url}" target="_blank" rel="noopener" style="color:var(--rust);text-decoration:none;font-family:\'Space Grotesk\',sans-serif;font-size:inherit">Tickets</a>` : '';
        return `<div style="padding:.75rem 0;border-bottom:1px solid rgba(242,240,234,0.08);font-family:'Space Grotesk',sans-serif;font-size:1rem;color:var(--paper);line-height:1.4">
  <div style="display:flex;flex-wrap:wrap;gap:.5rem .75rem;align-items:baseline">
    <strong style="font-weight:700;color:var(--paper);font-size:inherit">${dateStr}</strong>
    <span>${venueStr}${venueStr && locStr ? ' — ' : ''}${locStr}</span>
    ${soldStr}
  </div>
  ${ticketStr ? `<div style="margin-top:.15rem">${ticketStr}</div>` : ''}
</div>`;
      }).join('');
    }
  } catch (e) {
    document.getElementById("tour-list").innerHTML = "<div class=\'card\' style=\'text-align:center\'><p style=\'color:var(--mist)\'>Unable to load tour dates.</p></div>";
  }
})();
</script>
</section><section class="section section-alt" id="contact" aria-label="Contact">
<div class="container" style="text-align:center;padding:4rem 1.5rem">
<h2 class="section-heading">Contact</h2>
<p><a href="mailto:meeusstan@gmail.com" style="font-size:1.5rem;color:var(--paper);text-decoration:none;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic">Bookings: meeusstan@gmail.com</a></p>
</div>
</section>
<footer style="border-top:1px solid rgba(242,240,234,0.1);padding:2rem 0;text-align:center"><img src="assets/home-logo.svg" alt="STANDUB" style="width:120px;height:auto;opacity:.35;display:block;margin:0 auto"></footer>
<script>/* IntersectionObserver active state for nav */ const navLinks=document.querySelectorAll('.site-nav a'); const sections=document.querySelectorAll('section[id]'); const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){navLinks.forEach(link=>{link.classList.toggle('nav-active',link.getAttribute('href')==='#'+entry.target.id);});}});},{threshold:0.3,rootMargin:'-70px 0px -40% 0px'}); sections.forEach(s=>observer.observe(s));</script>
</body>
</html>
